name: Neon Migrate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Shared Neon environment to migrate
        required: true
        default: development
        type: choice
        options:
          - development
          - staging
  push:
    branches:
      - main
    paths:
      - 'ops/neon-promotion.json'

permissions:
  contents: read

concurrency:
  group: neon-migrate-shared-environments
  cancel-in-progress: false

env:
  NEON_PROJECT_ID: morning-grass-06967990

jobs:
  migrate:
    name: Migrate shared Neon environment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Resolve target environment
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            target="${{ inputs.environment }}"
          else
            target="$(jq -r '.environment' ops/neon-promotion.json)"
          fi
          case "$target" in
            development|staging) ;;
            *) echo "Only development and staging are allowed." >&2; exit 1 ;;
          esac
          echo "environment=$target" >> "$GITHUB_OUTPUT"
          echo "TARGET_ENVIRONMENT=$target" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve admin connection
        id: admin
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: production
          branch_name: ${{ steps.target.outputs.environment }}
          database: nexora
          role: nexora_owner
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Bootstrap migration capability
        env:
          ADMIN_DATABASE_URL: ${{ steps.admin.outputs.db_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ADMIN_DATABASE_URL"
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT CREATE ON DATABASE nexora TO nexora_owner;
          GRANT USAGE, CREATE ON SCHEMA public TO nexora_owner;
          SQL

      - name: Resolve migrator connection
        id: migrator
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: production
          branch_name: ${{ steps.target.outputs.environment }}
          database: nexora
          role: nexora_migrator
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Apply versioned Drizzle migrations
        shell: bash
        env:
          MIGRATOR_DATABASE_URL: ${{ steps.migrator.outputs.db_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$MIGRATOR_DATABASE_URL"
          if [[ "$MIGRATOR_DATABASE_URL" == *"?"* ]]; then
            OWNER_DATABASE_URL="${MIGRATOR_DATABASE_URL}&options=-c%20role%3Dnexora_owner"
          else
            OWNER_DATABASE_URL="${MIGRATOR_DATABASE_URL}?options=-c%20role%3Dnexora_owner"
          fi
          echo "::add-mask::$OWNER_DATABASE_URL"
          pnpm --filter @nexora/database db:check
          DATABASE_URL="$OWNER_DATABASE_URL" pnpm --filter @nexora/database db:migrate
          expected="$(jq '.entries | length' packages/database/migrations/meta/_journal.json)"
          actual="$(psql "$OWNER_DATABASE_URL" -Atqc 'select count(*) from drizzle.__drizzle_migrations')"
          [[ "$actual" == "$expected" ]] || {
            echo "Migration ledger mismatch: expected $expected, found $actual" >&2
            exit 1
          }
          echo "EXPECTED_MIGRATIONS=$expected" >> "$GITHUB_ENV"

      - name: Verify Wave 0018 through 0022 baselines
        shell: bash
        env:
          MIGRATOR_DATABASE_URL: ${{ steps.migrator.outputs.db_url }}
        run: |
          set -euo pipefail
          if [[ "$MIGRATOR_DATABASE_URL" == *"?"* ]]; then
            OWNER_DATABASE_URL="${MIGRATOR_DATABASE_URL}&options=-c%20role%3Dnexora_owner"
          else
            OWNER_DATABASE_URL="${MIGRATOR_DATABASE_URL}?options=-c%20role%3Dnexora_owner"
          fi
          psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $block$
          DECLARE
            tables_count integer;
            rls_count integer;
          BEGIN
            SELECT count(*) INTO tables_count
              FROM information_schema.tables
             WHERE table_schema='public'
               AND table_name IN ('documents','document_versions','document_validations','business_party_documents','transport_request_documents');
            IF tables_count <> 5 THEN RAISE EXCEPTION 'Wave 0018 document tables incomplete: %', tables_count; END IF;
            SELECT count(*) INTO rls_count
              FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
             WHERE n.nspname='public' AND c.relname IN ('documents','document_versions','document_validations','business_party_documents','transport_request_documents') AND c.relrowsecurity;
            IF rls_count <> 5 THEN RAISE EXCEPTION 'Wave 0018 document RLS incomplete: %', rls_count; END IF;
            SELECT count(*) INTO tables_count
              FROM information_schema.tables
             WHERE table_schema='public' AND table_name IN ('transport_request_items','transport_request_packages','transport_request_requirements','transport_request_references','transport_request_status_history','transport_request_events','freight_lanes');
            IF tables_count <> 7 THEN RAISE EXCEPTION 'Wave 0019 freight normalization tables incomplete: %', tables_count; END IF;
            SELECT count(*) INTO rls_count
              FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
             WHERE n.nspname='public' AND c.relname IN ('transport_request_items','transport_request_packages','transport_request_requirements','transport_request_references','transport_request_status_history','transport_request_events','freight_lanes') AND c.relrowsecurity;
            IF rls_count <> 7 THEN RAISE EXCEPTION 'Wave 0019 freight normalization RLS incomplete: %', rls_count; END IF;
            IF NOT has_table_privilege('nexora_app','public.freight_lanes','SELECT') OR NOT has_table_privilege('nexora_app','public.freight_lanes','INSERT') OR NOT has_table_privilege('nexora_app','public.freight_lanes','UPDATE') OR has_table_privilege('nexora_app','public.freight_lanes','DELETE') THEN RAISE EXCEPTION 'Wave 0019 freight_lanes runtime privileges are incorrect'; END IF;
            IF has_table_privilege('nexora_app','public.transport_request_status_history','UPDATE') OR has_table_privilege('nexora_app','public.transport_request_status_history','DELETE') OR has_table_privilege('nexora_app','public.transport_request_events','UPDATE') OR has_table_privilege('nexora_app','public.transport_request_events','DELETE') THEN RAISE EXCEPTION 'Wave 0019 history/events must remain append-only'; END IF;
            SELECT count(*) INTO tables_count FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('matching_rules','matching_preferences','matching_runs','matching_candidates','matching_candidate_scores','matching_rule_results','matching_rejections');
            IF tables_count <> 7 THEN RAISE EXCEPTION 'Wave 0020 matching tables incomplete: %', tables_count; END IF;
            SELECT count(*) INTO rls_count FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname IN ('matching_rules','matching_preferences','matching_runs','matching_candidates','matching_candidate_scores','matching_rule_results','matching_rejections') AND c.relrowsecurity;
            IF rls_count <> 7 THEN RAISE EXCEPTION 'Wave 0020 matching RLS incomplete: %', rls_count; END IF;
            IF EXISTS (SELECT 1 FROM unnest(ARRAY['matching_rules','matching_preferences','matching_runs']) AS t(table_name) WHERE NOT has_table_privilege('nexora_app',format('public.%I',table_name),'SELECT') OR NOT has_table_privilege('nexora_app',format('public.%I',table_name),'INSERT') OR NOT has_table_privilege('nexora_app',format('public.%I',table_name),'UPDATE') OR has_table_privilege('nexora_app',format('public.%I',table_name),'DELETE')) THEN RAISE EXCEPTION 'Wave 0020 mutable matching privileges are incorrect'; END IF;
            IF EXISTS (SELECT 1 FROM unnest(ARRAY['matching_candidates','matching_candidate_scores','matching_rule_results','matching_rejections']) AS t(table_name) WHERE NOT has_table_privilege('nexora_app',format('public.%I',table_name),'SELECT') OR NOT has_table_privilege('nexora_app',format('public.%I',table_name),'INSERT') OR has_table_privilege('nexora_app',format('public.%I',table_name),'UPDATE') OR has_table_privilege('nexora_app',format('public.%I',table_name),'DELETE')) THEN RAISE EXCEPTION 'Wave 0020 historical matching privileges are incorrect'; END IF;
            SELECT count(*) INTO tables_count FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('negotiation_threads','negotiation_participants','negotiation_messages');
            IF tables_count <> 3 THEN RAISE EXCEPTION 'Wave 0021 negotiation tables incomplete: %', tables_count; END IF;
            SELECT count(*) INTO rls_count FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname IN ('negotiation_threads','negotiation_participants','negotiation_messages') AND c.relrowsecurity;
            IF rls_count <> 3 THEN RAISE EXCEPTION 'Wave 0021 negotiation RLS incomplete: %', rls_count; END IF;
            IF EXISTS (SELECT 1 FROM unnest(ARRAY['negotiation_threads','negotiation_participants']) AS t(table_name) WHERE NOT has_table_privilege('nexora_app',format('public.%I',table_name),'SELECT') OR NOT has_table_privilege('nexora_app',format('public.%I',table_name),'INSERT') OR NOT has_table_privilege('nexora_app',format('public.%I',table_name),'UPDATE') OR has_table_privilege('nexora_app',format('public.%I',table_name),'DELETE')) THEN RAISE EXCEPTION 'Wave 0021 mutable negotiation privileges are incorrect'; END IF;
            IF NOT has_table_privilege('nexora_app','public.negotiation_messages','SELECT') OR NOT has_table_privilege('nexora_app','public.negotiation_messages','INSERT') OR has_table_privilege('nexora_app','public.negotiation_messages','UPDATE') OR has_table_privilege('nexora_app','public.negotiation_messages','DELETE') THEN RAISE EXCEPTION 'Wave 0021 negotiation_messages must remain append-only'; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname='negotiation_messages' AND t.tgname='negotiation_messages_reply_scope_trigger' AND NOT t.tgisinternal) THEN RAISE EXCEPTION 'Wave 0021 reply scope trigger is missing'; END IF;
            SELECT count(*) INTO tables_count FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('trips','trip_transport_requests','trip_stops','trip_drivers','trip_assets','trip_status_history');
            IF tables_count <> 6 THEN RAISE EXCEPTION 'Wave 0022 trips tables incomplete: %', tables_count; END IF;
            SELECT count(*) INTO rls_count FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname IN ('trips','trip_transport_requests','trip_stops','trip_drivers','trip_assets','trip_status_history') AND c.relrowsecurity;
            IF rls_count <> 6 THEN RAISE EXCEPTION 'Wave 0022 trips RLS incomplete: %', rls_count; END IF;
            IF EXISTS (SELECT 1 FROM unnest(ARRAY['trips','trip_transport_requests','trip_stops','trip_drivers','trip_assets']) AS t(table_name) WHERE NOT has_table_privilege('nexora_app',format('public.%I',table_name),'SELECT') OR NOT has_table_privilege('nexora_app',format('public.%I',table_name),'INSERT') OR NOT has_table_privilege('nexora_app',format('public.%I',table_name),'UPDATE') OR has_table_privilege('nexora_app',format('public.%I',table_name),'DELETE')) THEN RAISE EXCEPTION 'Wave 0022 mutable trip privileges are incorrect'; END IF;
            IF NOT has_table_privilege('nexora_app','public.trip_status_history','SELECT') OR NOT has_table_privilege('nexora_app','public.trip_status_history','INSERT') OR has_table_privilege('nexora_app','public.trip_status_history','UPDATE') OR has_table_privilege('nexora_app','public.trip_status_history','DELETE') THEN RAISE EXCEPTION 'Wave 0022 trip_status_history must remain append-only'; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_indexes WHERE schemaname='public' AND indexname='trip_transport_requests_active_request_unique') OR NOT EXISTS (SELECT 1 FROM pg_indexes WHERE schemaname='public' AND indexname='trip_transport_requests_active_contract_unique') THEN RAISE EXCEPTION 'Wave 0022 active trip request/contract uniqueness is missing'; END IF;
          END
          $block$;
          SQL

      - name: Migration summary
        run: |
          {
            echo "## Neon migration passed"
            echo ""
            echo "- Environment: ${TARGET_ENVIRONMENT}"
            echo "- Versioned migrations: ${EXPECTED_MIGRATIONS}"
            echo "- Wave 0018 document baseline: verified"
            echo "- Wave 0019 freight normalization baseline: verified"
            echo "- Wave 0020 matching persistence baseline: verified"
            echo "- Wave 0021 negotiation collaboration baseline: verified"
            echo "- Wave 0022 trips core baseline: verified"
            echo "- Production: not addressable by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
