name: Neon Production Bootstrap

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PROVISION-PRODUCTION to verify the canonical Neon production root branch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: neon-production-bootstrap
  cancel-in-progress: false

env:
  NEON_PROJECT_ID: morning-grass-06967990
  PGSSLMODE: verify-full
  PGSSLROOTCERT: /etc/ssl/certs/ca-certificates.crt

jobs:
  bootstrap:
    name: Verify canonical root/default production branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production

    steps:
      - name: Validate explicit production confirmation
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.confirmation }}" == "PROVISION-PRODUCTION" ]] || {
            echo "Explicit confirmation PROVISION-PRODUCTION is required." >&2
            exit 1
          }

      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          test -r "$PGSSLROOTCERT" || {
            echo "System CA bundle is unavailable at $PGSSLROOTCERT." >&2
            exit 1
          }

      - name: Resolve canonical root/default production branch
        id: production
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}" || {
            echo "NEON_API_KEY is not configured for the protected production environment." >&2
            exit 1
          }

          branches_json="$(curl -fsS \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches")"

          branch_id="$(jq -er '[.branches[] | select(.name == "production" and (.parent_id? == null) and .default == true)][0].id' <<<"$branches_json")" || {
            echo "Canonical Neon production must exist as the root/default branch." >&2
            exit 1
          }

          echo "branch_id=$branch_id" >> "$GITHUB_OUTPUT"

      - name: Resolve production admin connection without creating branches
        id: connection
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PRODUCTION_BRANCH_ID: ${{ steps.production.outputs.branch_id }}
        run: |
          set -euo pipefail

          harden_connection_uri() {
            local raw_uri="$1"
            python3 - "$raw_uri" <<'PY'
          import sys
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit

          uri = urlsplit(sys.argv[1])
          query = [
              (key, value)
              for key, value in parse_qsl(uri.query, keep_blank_values=True)
              if key.lower() not in {"sslmode", "sslrootcert"}
          ]
          query.append(("sslmode", "verify-full"))
          print(urlunsplit((uri.scheme, uri.netloc, uri.path, urlencode(query), uri.fragment)))
          PY
          }

          raw_admin_url="$(curl -fsSG \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            --data-urlencode "branch_id=${PRODUCTION_BRANCH_ID}" \
            --data-urlencode "database_name=nexora" \
            --data-urlencode "role_name=nexora_owner" \
            --data-urlencode "pooled=false" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri" \
            | jq -er '.uri')"
          test -n "$raw_admin_url" || {
            echo "Failed to resolve production admin connection URI." >&2
            exit 1
          }

          admin_url="$(harden_connection_uri "$raw_admin_url")"
          [[ "$admin_url" == *"sslmode=verify-full"* ]] || {
            echo "Production admin connection URI is not hardened with sslmode=verify-full." >&2
            exit 1
          }

          echo "::add-mask::$raw_admin_url"
          echo "::add-mask::$admin_url"
          echo "admin_url=$admin_url" >> "$GITHUB_OUTPUT"

      - name: Verify TLS and required role posture read-only
        shell: bash
        env:
          PRODUCTION_ADMIN_DATABASE_URL: ${{ steps.connection.outputs.admin_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$PRODUCTION_ADMIN_DATABASE_URL"

          tls_posture="$(psql "$PRODUCTION_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -F '|' -Atqc \
            "select ssl::text, coalesce(version, ''), coalesce(cipher, '') from pg_stat_ssl where pid = pg_backend_pid();")"
          IFS='|' read -r tls_active tls_version tls_cipher <<< "$tls_posture"

          [[ "$tls_active" == "true" ]] || {
            echo "Production bootstrap is blocked: database session must use TLS." >&2
            exit 1
          }
          case "$tls_version" in
            TLSv1.2|TLSv1.3) ;;
            *)
              echo "Production bootstrap is blocked: TLS protocol must be TLSv1.2 or TLSv1.3; found '${tls_version:-unknown}'." >&2
              exit 1
              ;;
          esac
          [[ -n "$tls_cipher" ]] || {
            echo "Production bootstrap is blocked: TLS cipher was not reported." >&2
            exit 1
          }

          psql "$PRODUCTION_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc \
            "select current_database(), current_user, current_setting('server_version_num');"

          missing_roles="$(psql "$PRODUCTION_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
            with required(role_name) as (
              values ('nexora_owner'), ('nexora_migrator'), ('nexora_app'), ('nexora_worker')
            )
            select coalesce(string_agg(role_name, ',' order by role_name), '')
              from required r
             where not exists (
               select 1 from pg_roles p where p.rolname = r.role_name
             );
          ")"
          [[ -z "$missing_roles" ]] || {
            echo "Missing required production roles: $missing_roles" >&2
            exit 1
          }

          role_count="$(psql "$PRODUCTION_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc \
            "select count(*) from pg_roles where rolname in ('nexora_owner','nexora_migrator','nexora_app','nexora_worker');")"
          [[ "$role_count" == "4" ]] || {
            echo "Expected 4 required Nexora roles, found $role_count." >&2
            exit 1
          }

          invalid_role_posture="$(psql "$PRODUCTION_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
            select count(*)
              from pg_roles
             where (
               rolname = 'nexora_owner'
               and (rolcanlogin or rolsuper or rolbypassrls or rolcreatedb or rolcreaterole)
             ) or (
               rolname in ('nexora_migrator','nexora_app','nexora_worker')
               and (not rolcanlogin or rolsuper or rolbypassrls or rolcreatedb or rolcreaterole)
             );
          ")"
          [[ "$invalid_role_posture" == "0" ]] || {
            echo "One or more Nexora production roles violate the minimum-privilege posture." >&2
            exit 1
          }

          migrator_owner_membership="$(psql "$PRODUCTION_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
            select count(*)
              from pg_auth_members m
              join pg_roles granted_role on granted_role.oid = m.roleid
              join pg_roles member_role on member_role.oid = m.member
             where granted_role.rolname = 'nexora_owner'
               and member_role.rolname = 'nexora_migrator'
               and m.set_option
               and not m.inherit_option
               and not m.admin_option;
          ")"
          [[ "$migrator_owner_membership" == "1" ]] || {
            echo "nexora_migrator must have SET ROLE membership in nexora_owner without INHERIT or ADMIN OPTION." >&2
            exit 1
          }

          runtime_owner_memberships="$(psql "$PRODUCTION_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
            select count(*)
              from pg_auth_members m
              join pg_roles granted_role on granted_role.oid = m.roleid
              join pg_roles member_role on member_role.oid = m.member
             where granted_role.rolname = 'nexora_owner'
               and member_role.rolname in ('nexora_app','nexora_worker');
          ")"
          [[ "$runtime_owner_memberships" == "0" ]] || {
            echo "Runtime roles must not inherit or SET ROLE to nexora_owner." >&2
            exit 1
          }

          echo "TLS_VERSION=$tls_version" >> "$GITHUB_ENV"
          echo "TLS_CIPHER=$tls_cipher" >> "$GITHUB_ENV"

      - name: Bootstrap verification summary
        shell: bash
        run: |
          {
            echo "## Neon Production bootstrap verification passed"
            echo ""
            echo "- Project: ${NEON_PROJECT_ID}"
            echo "- Branch: production"
            echo "- Branch type: root"
            echo "- Default branch: yes"
            echo "- Database: nexora"
            echo "- TLS required: yes"
            echo "- TLS protocol: ${TLS_VERSION}"
            echo "- TLS cipher reported: yes"
            echo "- Server authentication: CA + hostname verification (sslmode=verify-full)"
            echo "- Verification: connectivity, required roles, minimum-privilege attributes and migrator membership"
            echo "- Migrations applied: no"
            echo "- Railway variables changed: no"
            echo "- API redeployed: no"
          } >> "$GITHUB_STEP_SUMMARY"
